<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan EMI Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h1 class="text-center mb-4">Loan EMI Calculator</h1>
        
        <div class="row">
            <!-- Form -->
            <div class="col-md-5">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">Calculate EMI</h5>
                    </div>
                    <div class="card-body">
                        <form id="emiForm">
                            <div class="mb-3">
                                <label class="form-label">Loan Amount (P) in PKR</label>
                                <input type="number" class="form-control" id="principal" required min="1" step="any">
                                <div class="invalid-feedback">Please enter a positive amount.</div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Annual Interest Rate (%)</label>
                                <input type="number" class="form-control" id="rate" required min="0.1" step="any">
                                <div class="invalid-feedback">Please enter a positive rate.</div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Tenure (months)</label>
                                <input type="number" class="form-control" id="months" required min="1" step="1">
                                <div class="invalid-feedback">Please enter a positive tenure.</div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100" id="calcBtn">Calculate</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Result Panel -->
            <div class="col-md-7">
                <div class="card shadow-sm mb-4" id="resultPanel" style="display:none; background-color: #d1e7dd;">
                    <div class="card-body">
                        <h5 class="card-title text-success">Calculation Result</h5>
                        <p class="mb-1"><strong>EMI:</strong> <span id="resEmi"></span> PKR</p>
                        <p class="mb-1"><strong>Total Payment:</strong> <span id="resTotal"></span> PKR</p>
                        <p class="mb-1"><strong>Total Interest:</strong> <span id="resInterest"></span> PKR</p>
                        <p class="mb-0"><strong>Served By:</strong> <span id="resServedBy"></span></p>
                    </div>
                </div>

                <!-- History Table -->
                <div class="card shadow-sm">
                    <div class="card-header bg-secondary text-white">
                        <h5 class="mb-0">Last 10 Calculations</h5>
                    </div>
                    <div class="card-body p-0">
                        <table class="table table-striped mb-0">
                            <thead>
                                <tr>
                                    <th>P</th>
                                    <th>Rate %</th>
                                    <th>n</th>
                                    <th>EMI</th>
                                    <th>Served By</th>
                                    <th>Time</th>
                                </tr>
                            </thead>
                            <tbody id="historyBody">
                                <tr><td colspan="6" class="text-center">Loading...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function loadHistory() {
            $.ajax({
                url: '/api/history',
                method: 'GET',
                success: function(data) {
                    let html = '';
                    if (data.length === 0) {
                        html = '<tr><td colspan="6" class="text-center">No calculations yet.</td></tr>';
                    } else {
                        data.forEach(item => {
                            const date = new Date(item.createdAt).toLocaleString();
                            html += `<tr>
                                <td>${item.principal}</td>
                                <td>${item.rate}</td>
                                <td>${item.months}</td>
                                <td>${item.emi.toFixed(2)}</td>
                                <td>${item.servedBy}</td>
                                <td>${date}</td>
                            </tr>`;
                        });
                    }
                    $('#historyBody').html(html);
                },
                error: function() {
                    $('#historyBody').html('<tr><td colspan="6" class="text-center text-danger">Failed to load history.</td></tr>');
                }
            });
        }

        $(document).ready(function() {
            loadHistory();

            $('#emiForm').on('submit', function(e) {
                e.preventDefault(); // No postback

                // Client-side validation
                const principal = parseFloat($('#principal').val());
                const rate = parseFloat($('#rate').val());
                const months = parseInt($('#months').val());

                if (principal <= 0 || rate <= 0 || months <= 0 || isNaN(principal) || isNaN(rate) || isNaN(months)) {
                    alert('Please enter valid positive numbers.');
                    return;
                }

                $('#calcBtn').prop('disabled', true).text('Calculating...');

                $.ajax({
                    url: '/api/emi',
                    method: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({ principal, rate, months }),
                    success: function(data) {
                        $('#resEmi').text(data.emi.toFixed(2));
                        $('#resTotal').text(data.totalPayment.toFixed(2));
                        $('#resInterest').text(data.totalInterest.toFixed(2));
                        $('#resServedBy').text(data.servedBy);
                        $('#resultPanel').show();
                        
                        // Reload history
                        loadHistory();
                    },
                    error: function(err) {
                        alert('Error: ' + (err.responseJSON?.error || 'Something went wrong'));
                    },
                    complete: function() {
                        $('#calcBtn').prop('disabled', false).text('Calculate');
                    }
                });
            });
        });
    </script>
</body>
</html>
